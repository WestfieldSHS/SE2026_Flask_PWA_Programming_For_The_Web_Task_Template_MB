<!-- row[0] = extID (not used in display) -->
<!-- row[1] = name (media  title) -->
<!-- row[2] = hyperlink (link destination) -->
<!-- row[3] = slogan (brief cool hype desc)-->
<!-- row[4] = genre (description text) -->
<!-- row[5] = about (icon URL) -->
<!-- row[6] = stars (not used in this template) -->
<!-- row[7] = platform -->
<!-- row[8] = status -->
<!-- row[9] = image -->

{% extends 'layout.html' %} {% block content %}
<div class="filter-buttons">
  <a href="/" class="filter-btn">All</a>
  <a href="/?status=Watched" class="filter-btn">Watched</a>
  <a href="/?status=Watching" class="filter-btn">Watching</a>
  <a href="/?status=Unwatched" class="filter-btn">Unwatched</a>
</div>

<div class="container">
    {% for row in content %}
    <div class="card">
        <img
            class="card-image"
            src="{{ row[9] }}"
            alt="Product image for {{ row[1] }}."
        />
        <div class="card-two">
            <h1 class="card-name">{{ row[1] }}</h1>
            <!-- <p class="card-slogan">"{{ row[3] }}"</p> -->
            <p class="card-genre">{{ row[4] }}</p>
            <p class="card-about">{{ row[5] }}</p>
            <p class="card-platform">{{ row[7] }}</p>
            <a class="card-link" href="{{ row[2] }}"><button class="btn">Read More</button></a>
        </div>
    </div>
    {% endfor %}
</div> 
{% endblock %}
